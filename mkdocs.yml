# Reference to a YouTube video tutorial for setting up MkDocs Material
# Ref :https://www.youtube.com/watch?v=DeZjkCtttss

# Name of the site that appears in the navigation bar and browser title
site_name: Crystal EMR
site_url: https://rhd1703.github.io/CrystalEMR-docs/
base_url: /CrystalEMR-docs/

theme:
  name: material  # Specifies the MkDocs Material theme
  favicon: assets/images/favicon/favicon-16x16.png  # Path to the favicon (browser icon)
  logo: assets/images/favicon/android-chrome-512x512.png  # Path to the site logo
  font:
    text: Roboto  # Sets the text font to Roboto
  
  palette:  # Defines color schemes for light and dark mode

    # Palette toggle for light mode
    - scheme: default  # Default (light) mode
      toggle:
        icon: material/toggle-switch  # Icon for switching themes
        name: Switch to dark mode  # Tooltip text for the theme toggle button
      primary: amber  # Primary color in light mode
      accent: indigo  # Accent color in light mode

    # Palette toggle for dark mode
    - scheme: slate  # Dark mode
      toggle:
        icon: material/toggle-switch-off-outline  # Icon for switching themes
        name: Switch to light mode  # Tooltip text for the theme toggle button
      primary: blue grey  # Primary color in dark mode
      accent: deep orange  # Accent color in dark mode

  features:  # List of enabled features for the Material theme
    - navigation.instant  # Enables faster navigation without reloading pages
    - navigation.instant.progress  # Shows progress indicator when navigating
    - navigation.instant.preview  # Previews pages before clicking
    - navigation.tracking  # Keeps track of navigation history
    - navigation.tabs  # Displays top navigation as tabs
    - navigation.path  # Shows the current page path
    - navigation.tabs.sticky  # Keeps navigation tabs visible when scrolling
    - navigation.sections  # Groups navigation into sections
    - navigation.expand  # Expands all sections in navigation by default
    - toc.integrate  # Integrates the table of contents with navigation
    - navigation.top  # Adds a "Back to top" button
    - search.suggest  # Suggests search results while typing
    - search.highlight  # Highlights search results in pages
    - search.share  # Allows sharing search queries
    - navigation.footer  # Adds a footer to navigation
    - content.tabs.link  # Enables linking to specific tabs
    - content.code.copy  # Adds a "Copy" button to code blocks
    - content.tooltips  # Enables tooltips when hovering over certain elements
    - header.autohide  # Automatically hides the header when scrolling down

plugins:
  - search  # Enables search functionality
  - tags  # Enables tag-based filtering and navigation
  # - mike:  # Mike plugin for versioning (commented out)
  #     # Optional fields for configuring versioning
  #     alias_type: symlink
  #     redirect_template: null
  #     deploy_prefix: ''
  #     canonical_version: null
  #     version_selector: true
  #     css_dir: css
  #     javascript_dir: js

extra:
  version:
    provider: mike  # Uses Mike for version control
  generator: false  # Hides "Generated by MkDocs" footer

  social:  # Social media links displayed in the footer
    # - icon: fontawesome/brands/github  # GitHub icon (commented out)
    #   link: https://github.com/rhd1703
    - icon: fontawesome/brands/youtube  # YouTube icon
      link: https://www.youtube.com/@crystal8383
    - icon: fontawesome/solid/paper-plane  # Email icon
      link: mailto:<info@crystalemr.com>



markdown_extensions:  # List of Markdown extensions for enhanced formatting
  - attr_list  # Allows adding attributes to Markdown elements
  - pymdownx.emoji:  # Enables emoji support
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition  # Enables note, warning, and other callout boxes
  - pymdownx.details  # Enables collapsible details sections
  - pymdownx.superfences  # Improves handling of nested code blocks
  - pymdownx.tabbed:  # Enables tabbed content
      alternate_style: true  # Uses an alternate tab style
  - toc:
      permalink: true  # Adds anchor links to headers
      toc_depth: 2  # Limits the depth of the table of contents (h1 and h2 only)
  - attr_list  # Allows adding custom attributes to elements
  - md_in_html  # Enables Markdown inside HTML blocks
  - pymdownx.blocks.caption  # Allows adding captions to code blocks
  - tables  # Enables table support in Markdown
  - pymdownx.critic  # Adds CriticMarkup support for tracking changes
  - pymdownx.caret  # Enables superscript formatting
  - pymdownx.keys  # Allows displaying keyboard shortcuts
  - pymdownx.mark  # Enables highlighting text
  - pymdownx.tilde  # Enables subscript formatting
  - pymdownx.tasklist:  # Enables checkboxes in task lists
      custom_checkbox: true  # Allows custom checkbox styling
  # - pymdownx.tasklist:
  #     clickable_checkbox: true  # Allows clicking checkboxes (commented out) 
  - attr_list
  - md_in_html


extra_css:  # Additional CSS files for customization
  - assets/css/extra.css
  - assets/css/style.css

copyright: Copyright &copy; 2025 Crystal EMR  # Footer copyright notice

